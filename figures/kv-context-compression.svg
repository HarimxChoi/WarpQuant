<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">KV cache compression by context length</title>
  <desc id="desc">K4 V4 with a recent BF16 window approaches 3.46 times compression at long contexts.</desc>
  <style>
    .bg{fill:#f7f8f5}.old{fill:#456b5a}.recent{fill:#b7c4bc}.panel{fill:#fff;stroke:#cbd2cc}.text{fill:#17221c;font:500 22px Inter,Arial,sans-serif}.label{fill:#617068;font:17px Inter,Arial,sans-serif}.value{fill:#17221c;font:500 18px ui-monospace,monospace}.ratio{fill:#456b5a;font:500 20px ui-monospace,monospace}
    @media(prefers-color-scheme:dark){.bg{fill:#161b18}.old{fill:#79a88f}.recent{fill:#526159}.panel{fill:#1e2521;stroke:#435048}.text,.value{fill:#edf4ef}.label{fill:#adbbb3}.ratio{fill:#9dc8ae}}
  </style>
  <rect class="bg" width="1200" height="500"/>
  <text class="text" x="60" y="54">KV cache · recent-window layout and context scaling</text>
  <rect class="old" x="60" y="90" width="880" height="58" rx="3"/><rect class="recent" x="940" y="90" width="190" height="58" rx="3"/><text x="500" y="126" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="18">K4 / V4 · older tokens</text><text class="value" x="1035" y="126" text-anchor="middle">BF16 · R128</text>
  <g transform="translate(60 190)"><rect class="panel" width="250" height="220" rx="4"/><text class="label" x="24" y="42">4K context</text><text class="value" x="24" y="92">0.25 → 0.08 GiB</text><text class="ratio" x="24" y="146">3.21×</text></g>
  <g transform="translate(335 190)"><rect class="panel" width="250" height="220" rx="4"/><text class="label" x="24" y="42">32K context</text><text class="value" x="24" y="92">2.00 → 0.58 GiB</text><text class="ratio" x="24" y="146">3.43×</text></g>
  <g transform="translate(610 190)"><rect class="panel" width="250" height="220" rx="4"/><text class="label" x="24" y="42">128K context</text><text class="value" x="24" y="92">8.00 → 2.32 GiB</text><text class="ratio" x="24" y="146">3.45×</text></g>
  <g transform="translate(885 190)"><rect class="panel" width="250" height="220" rx="4"/><text class="label" x="24" y="42">256K context</text><text class="value" x="24" y="92">16.00 → 4.63 GiB</text><text class="ratio" x="24" y="146">3.46×</text></g>
  <text class="label" x="60" y="458">The fixed BF16 recent window becomes negligible as context grows.</text>
</svg>
